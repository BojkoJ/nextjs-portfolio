name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # Fails the build on known high/critical vulnerabilities in shipped deps.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          RESEND_API_KEY: re_ci_placeholder
